name: GraalVM Check

on:
  schedule:
    - cron: "30 18 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Run StdLib Workflow
    if: ${{ github.event_name != 'schedule' || (github.event_name == 'schedule' && github.repository_owner == 'ballerina-platform') }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v3

      - name: Resolve Ballerina version
        # The shared ballerina-platform/ballerina-library template defaults to the "nightly"
        # Ballerina build outside of pull_request events, which depends on
        # ballerina-platform/ballerina-distribution's daily-build workflow succeeding. That
        # pipeline has been failing upstream, breaking this check on schedule/workflow_dispatch
        # triggers. Pin to this repo's own known-good ballerinaLangVersion instead so the
        # GraalVM check doesn't depend on an unrelated, currently-broken nightly build.
        run: |
          BAL_VERSION="$(grep -E '^\s*ballerinaLangVersion\s*=' gradle.properties | head -n 1 | cut -d= -f2- | xargs)"
          echo "BAL_VERSION=${BAL_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved BAL_VERSION: ${BAL_VERSION}"

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.3
        with:
          version: ${{ env.BAL_VERSION }}

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          set-java-home: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GraalVM installation
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          native-image --version

      - name: Build Package
        run: ./gradlew build
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Target Directory
        run: sudo rm -rf ballerina/target

      - name: Test with GraalVM
        run: |
          cd ballerina
          bal test --graalvm
